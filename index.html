<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lisbon delivery</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #707579);
      --card: var(--tg-theme-secondary-bg-color, #242f3d);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px 16px 120px;
    }
    h2 { font-size: 20px; margin-bottom: 12px; }
    .row { display: flex; gap: 10px; margin-bottom: 12px; }
    .opt {
      flex: 1;
      padding: 12px;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
    }
    .opt.active { border-color: var(--button); }
    select, input {
      width: 100%;
      padding: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--hint);
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .info {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--hint);
    }
    .foot {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      padding: 16px;
      border-top: 1px solid var(--card);
    }
    .warn { color: #ff5959; font-size: 13px; margin-bottom: 8px; text-align: center; }
    button.go {
      width: 100%;
      background: var(--button);
      color: var(--button-text);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.go:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const ZONES = [
      { name: "Lisbon center", fee: 20, min: 100 },
      { name: "Greater Lisbon", fee: 35, min: 200 }
    ];

    let S = {
      step: 1,
      mode: 'delivery',
      zone: 'Lisbon center',
      address: '',
      menu: '420'
    };

    function zoneObj() {
      return ZONES.find(z => z.name === S.zone);
    }

    function render() {
      let html = '';

      if (S.step === 1) {
        html += `
          <h2>How do you want to receive it?</h2>
          <div class="row">
            <div class="opt ${S.mode==='delivery'?'active':''}" onclick="S.mode='delivery';render()">Delivery</div>
            <div class="opt ${S.mode==='pickup'?'active':''}" onclick="S.mode='pickup';render()">Pickup</div>
          </div>
        `;

        if (S.mode === 'delivery') {
          html += `
            <select onchange="S.zone=this.value;render()">
              <option value="">Select your area</option>
              ${ZONES.map(z => `<option value="${z.name}" ${S.zone===z.name?'selected':''}>${z.name}</option>`).join('')}
            </select>
